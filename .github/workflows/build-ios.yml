# Builds an UNSIGNED Speedcam.ipa on a macOS runner.
# Sign & install it on your iPhone with Sideloadly (free Apple ID, re-sign every 7 days).
name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Expo SDK 57 is built against Xcode 26.6 (see EAS image sdk-57).
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=/Applications/Xcode_26.6.app
          [ -d "$XC" ] || XC="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build app (no code signing)
        run: |
          xcodebuild \
            -workspace ios/Speedcam.xcworkspace \
            -scheme Speedcam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || {
              echo "::group::errors"
              grep -n -E "error:|error |FAILED|Error:" xcodebuild.log | head -100
              echo "::endgroup::"
              tail -n 80 xcodebuild.log
              exit 1
            }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Speedcam.app Payload/
          zip -qry Speedcam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Speedcam-ipa
          path: Speedcam.ipa
          retention-days: 30
