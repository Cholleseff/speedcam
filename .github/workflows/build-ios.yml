# Builds an UNSIGNED Speedcam.ipa on a macOS runner.
# Sign & install it on your iPhone with Sideloadly (free Apple ID, re-sign every 7 days).
name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Speedcam.xcworkspace \
            -scheme Speedcam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Speedcam.app Payload/
          zip -qry Speedcam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Speedcam-ipa
          path: Speedcam.ipa
          retention-days: 30
